<! doctype html>
<html lang="pt-br">
	<head>	
		<meta charset="UTF-8" />
		<title> number type </title>
	</head>
	<body>
		<p> Utilizando type number</p>
		<input name="valuex" type="number" value="12.4" step="0.2 min" max="20"/> 
		<br><br>

		<p> Utilizando type number</p>
		<input name="valuex" type="range" value="12.4" step="0.2 min" max="20"/> 
		<br><br>
		
		<p> Utilizando type onfocus</p>
		<input name="q" value="Search here" onfocus="if(this.value=='Search here') this.value=''" /> 
		<br><br>
		
		<p> Utilizando type placeholder</p>
		<input name="q" placeholder="Search here..." / value="uso do placeholder">
		<br><br>

	</body>
</html>
