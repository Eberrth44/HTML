<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulario</title>
    <style rel="stylesheet"> 
    *,
    *::before,
    *::after{
        -webkit-box-sizing: border-box;
        -moz-box-sizing: border-box;
        box-sizing: border-box;
    }
    .clear{clear: both;}

    body{
        font: 18px / 1px arial, sans-serif;
        color: #333;
        background: #CCC;        
    }
    #tudo{
        width:100%;
        max-width: 1200px;
        min-width: 860px;
        background: #fff;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        color: #036;
    }
    
    .topo_header{
        background: #036;
        padding: 5px 20px;
    }

    .topo_header h1{
        font-size: 36px;
        margin: 4px 0 2px 0;
    }

    .topo_header a {
        color: #fff;
        text-decoration: nome;
    }

    .topo_header h2{
        font-size: 20px;
        margin: 2px 0 4px 0;
        color: #fff;
    }

    .principal {
        width: 100%;
        padding: 20px 15px;
    }

    .rodape{
        background: #036;
        color: #fff;
        padding: 5px 0;
        text-align: center;
    }

    pre{font-size: 14;}
    @media(max-width:1040px){
        pre{font-size: 12px;}
        }

/* FORMULARIO */
    </style>

</head>
<body class="home"> 
    <div id="tudo"> 
        <div class="topo"> 
            <header class="topo_header"> 
                <hgroup> 
                    <h1><a href="/Formulario"></a></h1>
                    <h2>Elementos de atributos</h2>
                </hgroup>
            </header>

        </div> <!--.topo -->

        <div class="principal"> </div>
            <main>
                <section>
                    <h1> Elementos Fieldse,Legend,label</h1>
                    <form action=""method=""></form>
                        <Fieldset> 
                            <legend>Dados pessoais</legend>
                            <p><small>Campos com rótulo implicito</small></p>
                            <label>Nome: <input="text" nome="nome"></label>
                            <label>Sobrenome: <input="text" nome="Sobrenome"></label>
                            <label>Email: <input="text" nome="Email"></label>

                        </Fieldset>

                        <Fieldset> 
                            <legend>Suas preferencias</legend>
                            <p><small>Campos com rótulo explicito</small></p>
                            <label for="livro">Livro:></label>
                                <input type="text" id="livro" name="livro">

                            <label>Filme:</label>
                                <input type="text" id="Filme" name="Filme">

                            <label>Esporte:</label>
                                <input type="text" id="Esporte" name="Esporte">

                        </Fieldset>


                </section>
            </main>
    </div> <!-- PRINCIPAL-->

    <div class="rodape">
        <footer>
            <small>SITE DESENVOLVIDO EBERTH DA SILVA RODRIGUES</small>
        </footer> 

    </div> <!--./rodape-->
    </div> <!--./topo-->

























































































    
</body>
</html>
