<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body  class="p-5">
    <section>
        <h2>Carrossel de Imagens</h2>
        <div id="carouselExample" class="carousel slide w-75" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="imgs/flamengo.jpg" class="d-block w-100" alt="Imagem 1">
            </div>
            <div class="carousel-item">
              <img src="imgs/flamengo_2025(2).jpg" class="d-block w-100" alt="Imagem 2">
            </div>
            <div class="carousel-item">
              <img src="imgs/flamengo_2025.jpg" class="d-block w-100" alt="Imagem 3">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </section>
      
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
